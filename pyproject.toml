[project]
name = "ppedet"
version = "0.1.0"
description = "PPE / safety-compliance object detection: fine-tuned SSDlite and Faster R-CNN on CPU, COCO metrics, threshold tuning, compliance-level KPIs"
requires-python = ">=3.10,<3.14"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pillow>=10",
    "torch>=2.3",
    "torchvision>=0.18",
    "pycocotools>=2.0.7",
    "mlflow>=2.12",
    "streamlit>=1.40",
    "plotly>=5.24",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5", "jupyter>=1.0", "nbconvert>=7", "ipykernel>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ppedet"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "app"]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
